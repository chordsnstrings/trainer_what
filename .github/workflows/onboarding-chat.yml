name: Onboarding conversation
on:
  pull_request:
    paths: ["apps/api/src/trainer-preview*.ts", "apps/web/components/trainer-preview.tsx", "apps/web/components/preview-navigation.tsx", "apps/web/lib/trainer-preview-routing.ts", "scripts/trainer-preview-check.mjs", "scripts/seed-trainer-preview.ts", "tests/trainer-preview*.ts", "apps/api/src/onboarding-*.ts", "apps/api/src/voice-clones.ts", "apps/web/components/onboarding-*.tsx", "apps/web/components/onboarding-*.ts", "apps/web/app/onboarding-chat.css", "apps/web/lib/conversation-audio.ts", "apps/web/public/onboarding-audio-worklet.js", "tests/onboarding-media.test.ts", "scripts/extract-office-extra.py", "apps/api/src/onboarding-chat.ts", "apps/web/components/onboarding-chat.tsx", "packages/domain/src/onboarding-chat.ts", "packages/domain/src/coaching-interview.ts", "packages/providers/src/onboarding-chat.ts", "tests/onboarding-chat.test.ts", "tests/coaching-interview.test.ts", "tests/onboarding-models.test.ts", "scripts/onboarding-chat-check.mjs", "scripts/run-onboarding-chat-check.mjs", "apps/api/src/brain-fidelity.ts", "apps/web/components/brain-fidelity.tsx", "packages/domain/src/brain-fidelity.ts", "tests/brain-fidelity.test.ts", "scripts/seed-brain-fidelity.ts"]
permissions:
  contents: read
jobs:
  conversation:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: sudo apt-get update && sudo apt-get install -y python3 python3-xlrd antiword poppler-utils tesseract-ocr ffmpeg
      - run: npm run typecheck
      - run: node --import tsx --test --test-concurrency=1 tests/trainer-preview.test.ts tests/brain-fidelity.test.ts tests/coaching-interview.test.ts tests/onboarding-chat.test.ts tests/onboarding-models.test.ts tests/onboarding-media.test.ts tests/logical-css.test.ts tests/bounded-bootstrap.test.ts
      - run: npm run build
      - run: npx playwright install --with-deps chromium --only-shell
      - name: Phone and desktop onboarding journeys
        run: node --import tsx scripts/run-onboarding-chat-check.mjs
        env:
          RTL_WEB_MODE: start
          RTL_WEB_PORT: "3203"
          RTL_API_PORT: "4203"
          RTL_DATA_DIR: .data/onboarding-chat-check
          AUTHENTICATOR_REQUIRED: "false"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: onboarding-conversation-evidence
          path: test-results/
          if-no-files-found: ignore
