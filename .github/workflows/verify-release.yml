name: Verify serving release
on:
  workflow_run:
    workflows: ["Application checks"]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: verify-serving-release
  cancel-in-progress: true
jobs:
  serving-release:
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 46
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Wait for checked main to serve
        env:
          EXPECTED_RELEASE: ${{ github.event.workflow_run.head_sha }}
        run: sh scripts/watch-release.sh "$EXPECTED_RELEASE" 40
